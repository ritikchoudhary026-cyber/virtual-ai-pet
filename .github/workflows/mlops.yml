name: MLOps Retraining

on:
  schedule:
    - cron: '0 0 * * 0'   # every Sunday midnight
  workflow_dispatch:       # manual trigger

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

jobs:
  retrain:
    runs-on: ubuntu-latest   # Using ubuntu-latest since we might not have a self-hosted runner
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install training dependencies
        run: pip install -r requirements-training.txt
        
      - name: Configure DVC (Simulated)
        run: |
          # For a real pipeline, you would need GCP credentials for dvc pull from gdrive
          # Since this is a demo, we will just echo instead of actually pulling
          echo "Simulating DVC pull..."
          # dvc pull
          
      - name: Run training script
        run: python train.py
        
      - name: Evaluate and register model
        run: python evaluate.py
        
      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}
          
      - name: If model improved, update Docker image
        if: success()
        run: |
          cd backend
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/pet-backend:latest .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/pet-backend:latest
